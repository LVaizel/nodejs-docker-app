on:
    push:
        branches:
            - main
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKER_USERNAME}}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                tags: lvaizel/nodejs-container-app:latest
    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
            - name: Deploy to Server
              run: |
                echo "Deploying container to production..."
                docker pull lvaizel/nodejs-container-app:latest
                docker stop nodejs-container-app || true
                docker rm nodejs-container-app || true
                docker run -d --name nodejs-container-app -p 80:3000 lvaizel/nodejs-container-app:latest