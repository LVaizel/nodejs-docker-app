on:
    push:
        branches:
            - main
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              env:
                DH_USER: ${{ secrets.DOCKER_USERNAME }}
                DH_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
              run: |
                printf '%s' "$DH_TOKEN" | docker login docker.io -u "$DH_USER" --password-stdin
            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                tags: <docker-username>/<repo-name>:latest
    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
            - name: Deploy to Server
              run: |
                echo "Deploying container to production..."
                docker pull <docker-username>/<repo-name>:latest
                docker stop my-app || true
                docker rm my-app || true
                docker run -d --name my-app -p 80:3000 <docker-username>/<repo-name>:latest